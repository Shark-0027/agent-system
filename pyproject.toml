[project]
name = "agent-system"
version = "1.0.0"
description = "可靠 AI Agent 系统开发 — Agent Runtime + MCP工具系统 + Planner-Executor"
requires-python = ">=3.10"
authors = [
    { name = "Shark-0027" },
]

dependencies = [
    "openai>=1.0.0",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
